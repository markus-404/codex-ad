[project]
name = "codex-ad"
version = "0.2.1"
description = "Shareable ad creative plugin with concept brainstorming and static ad prompt generation"
requires-python = ">=3.9"
dependencies = [
  "openai>=1.0.0",
  "pillow>=10.0.0",
  "pyyaml>=6.0.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0"
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
