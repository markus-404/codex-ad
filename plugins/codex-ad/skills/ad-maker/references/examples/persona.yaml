name: Busy Home Cook
summary: A working adult who wants dinner to feel elevated without extra prep.
core_motivations:
  - save time
  - avoid bland meals
  - feel competent cooking at home
barriers_objections:
  - skeptical of premium price
  - dislikes complicated recipes
  - worries bottled sauce tastes artificial
what_convinces:
  - simple ingredient cues
  - appetizing usage scene
  - clear time-saving promise
preferred_channels:
  - Instagram
  - Facebook
  - TikTok
